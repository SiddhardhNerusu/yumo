name: Yumo
options:
  bundleIdPrefix: com.sidnerusu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: KX4SBPJ7C4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yumo:
    type: application
    platform: iOS
    sources:
      - path: Yumo
        excludes: ["**/*.md"]
    entitlements:
      path: Yumo/Yumo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Yumo/Info.plist
      properties:
        CFBundleDisplayName: Yumo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Yumo uses the camera to scan food barcodes and to attach progress photos to weight entries.
        NSPhotoLibraryUsageDescription: Yumo lets you attach a photo from your library to a weight entry.
        NSHealthShareUsageDescription: Yumo reads your body mass from Apple Health so your weight log stays in sync.
        NSHealthUpdateUsageDescription: Yumo writes your weight and the energy, protein, carbs and fat you log to Apple Health.
        UIAppFonts:
          - Nunito-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidnerusu.yumo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
